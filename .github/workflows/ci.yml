name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: codebase

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: codebase/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  smoke:
    runs-on: ubuntu-latest
    needs: build

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017/ai-crm-smoke
      NODE_ENV: development
      JWT_SECRET: ci-jwt-secret-for-smoke-tests-only
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-32chars!!
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PORT: 4000
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      INTERNAL_SERVICE_TOKEN: dev-internal-token-change-in-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: codebase/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API smoke tests
        run: |
          pnpm --filter @ai-crm/api dev &
          API_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health >/dev/null; then break; fi
            if ! kill -0 "$API_PID" 2>/dev/null; then echo "API process exited early"; exit 1; fi
            sleep 2
          done
          curl -sf http://localhost:4000/health
          pnpm --filter @ai-crm/api smoke
          kill "$API_PID" || true

  e2e:
    runs-on: ubuntu-latest
    needs: build

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017/ai-crm-e2e
      NODE_ENV: development
      JWT_SECRET: ci-jwt-secret-for-e2e-tests-only
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-32chars!!
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SSE_URL: http://localhost:4000
      PORT: 4000
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      INTERNAL_SERVICE_TOKEN: dev-internal-token-change-in-prod
      PLAYWRIGHT_API_URL: http://localhost:4000
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: codebase/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: codebase/apps/web

      - name: E2E tests
        run: pnpm test:e2e
